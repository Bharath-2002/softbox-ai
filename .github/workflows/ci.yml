name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .python-version and pyproject's requires-python.
  PYTHON_VERSION: "3.12"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests

      - name: Types
        run: uv run mypy

      # Architectural contracts (docs/ARCHITECTURE.md D5-D9). Kept as its own
      # step so a violation is obvious in the job summary rather than buried.
      - name: Import contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
