repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run from the project venv so the contracts see the installed package.
      - id: import-linter
        name: architectural import contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

      # Tests gate the commit rather than relying on anyone remembering to run
      # them. If this ever becomes slow enough to tempt --no-verify, split the
      # slow tests behind a marker instead of removing the hook.
      - id: pytest
        name: tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
