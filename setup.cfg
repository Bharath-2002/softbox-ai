; Architectural contracts, enforced in CI by `lint-imports`.
; These are the rules described in docs/ARCHITECTURE.md D5-D9. If a change here
; is needed, the decision record changes with it.

[importlinter]
root_package = app
; Required so the pure_domain / services_no_web contracts can name third-party
; packages (sqlalchemy, fastapi, ...) as forbidden.
include_external_packages = True

[importlinter:contract:layers]
name = Layered architecture - a layer may import only from layers below it
type = layers
layers =
    app.api
    app.agents
    app.features
    app.services
    app.entities
    app.shared

[importlinter:contract:infra_isolation]
name = Infrastructure is reachable only from the composition root
type = forbidden
source_modules =
    app.api
    app.agents
    app.features
    app.services
    app.entities
    app.shared
forbidden_modules =
    app.infrastructure

[importlinter:contract:pure_domain]
name = Entities are framework-free
type = forbidden
source_modules =
    app.entities
    app.shared
forbidden_modules =
    sqlalchemy
    fastapi
    asyncpg
    alembic
    httpx

[importlinter:contract:services_no_web]
name = Services and features carry no web framework concerns
type = forbidden
source_modules =
    app.services
    app.features
forbidden_modules =
    fastapi
    starlette

[importlinter:contract:infra_does_not_import_bootstrap]
name = Infrastructure must not import the composition root
type = forbidden
source_modules =
    app.infrastructure
forbidden_modules =
    app.bootstrap
; bootstrap wires infrastructure, never the reverse - infrastructure adapters
; take plain config values (a DSN string, a bucket name), never a Settings
; object, so bootstrap -> infrastructure -> bootstrap cannot happen.
